name: Workflow request
description: Propose a reusable civil-engineering academic-writing workflow.
title: "[Workflow] "
body:
  - type: markdown
    attributes:
      value: |
        This is a public repository. Issue Form required settings provide a structured confirmation only; issue content may be visible to anyone, and the form cannot prevent disclosure of sensitive information. Do not submit manuscripts, private paths, credentials, Zotero storage keys, or unpublished data.
        本仓库为公开仓库。Issue Form 的 required 设置仅用于结构化确认；Issue 内容可能被任何人查看，表单本身不能阻止敏感信息披露。请勿提交稿件、私人路径、凭据、Zotero storage key 或未公开数据。
  - type: textarea
    id: scenario
    attributes:
      label: Research scenario
      description: State the manuscript type, section, and engineering context.
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Desired deliverable
      description: State the exact output the skill should produce.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Available evidence
      description: List generic evidence types such as figures, tables, equations, standards, or full text.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and failure risks
    validations:
      required: true
  - type: textarea
    id: reusable_value
    attributes:
      label: Reusable value
      description: Explain how the workflow generalizes beyond one manuscript.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I understand this is a structured confirmation only, and I removed manuscript text, private paths, credentials, Zotero storage keys, access tokens, and unpublished research data.
          required: true
